version: 2.1

parameters:
  docker-image:
    type: string
    default: cimg/node:20.5.0

jobs:
  build:
    docker:
      - image: << pipeline.parameters.docker-image >>
    steps:
      - checkout
      - run:
          command: |
            echo 'Hello World!'
            echo 'This is the delivery pipeline'
      - run:
          name: Update npm
          command: 'sudo npm install -g npm@latest'
      - restore_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
      - run:
          name: Install Dependencies
          command: npm ci --no-audit
      - save_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
            - ~/.cache

  lint: 
    docker: 
      - image: << pipeline.parameters.docker-image >>
    steps:
      - checkout
      - restore_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
      - run: 
          command: |
            echo 'Run linter check'
            npm run lint

  test: 
    docker: 
      - image: << pipeline.parameters.docker-image >>
    steps:
      - checkout
      - restore_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
      - run: 
          command: |
            echo 'Tests must run'
            npm run test

workflows:
  build_and_test:
    jobs:
      - build
      - lint: 
         requires:
          - build
      - test: 
         requires:
          - lint